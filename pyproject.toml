[project]
name = "gscope-cli"
version = "0.3.0"
description = "Unofficial instructor-side Gradescope client: read outlines, push rubrics, from Python or the command line."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "higger", email = "matt.higger@gmail.com" }]
keywords = ["gradescope", "rubric", "grading", "teaching", "education"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

dependencies = ["requests>=2.25"]

[project.optional-dependencies]
# Read the session cookie from a local browser profile (gscope login).
browser = ["browser_cookie3>=0.19"]
# Bridge from pset (LaTeX problem repos) to Gradescope outlines and rubrics.
# Not implemented yet; the extra is reserved so the install syntax is stable.
pset = ["pset>=0.6"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/matthigger/gscope"
Issues = "https://github.com/matthigger/gscope/issues"

[project.scripts]
gscope = "gscope.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gscope"]
